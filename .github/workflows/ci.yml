name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [ci, debug]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain versions
        run: |
          cmake --version
          c++ --version | head -1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Run the example
        run: ./build/${{ matrix.preset }}/design_workflow_example

  sanitizers:
    name: ubuntu-latest / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset sanitizers
      - name: Build
        run: cmake --build --preset sanitizers --parallel 4
      - name: Test
        env:
          ASAN_OPTIONS: abort_on_error=1:strict_string_checks=1:detect_leaks=1
        run: ctest --preset sanitizers
